# Release on a version tag: stage the package, then a human approves it.
#
# There is no npm token here, and that is deliberate. npm's OIDC *trusted publishing* mints a
# short-lived credential per run, scoped to this repository and this workflow filename, so there
# is nothing long-lived to leak or rotate.
#
# The trust record lives in npm's configuration, not here:
#
#   npmjs.com -> @sven1103-agent/pi-metrics -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user : sven1103-agent
#     Repository           : pi-metrics
#     Workflow filename    : publish.yml        <- must match this file's name exactly
#     Environment name     : (empty)            <- this workflow declares no environment
#     Allowed actions      : leave `npm publish` and `npm dist-tag` OFF
#
# That last line is the point. `npm stage publish` is always permitted, and direct `npm publish`
# is opt-in — leaving it off means a compromised workflow can only *stage* a release, never ship
# one. npm's own guidance is to leave it off. The cost is that every release needs a human:
#
#   1. a tag push runs this workflow, which stages the version on npm
#   2. a maintainer approves it with 2FA — `npm stage approve <id>` or the npm website
#   3. only then does the version appear on the registry, and the draft GitHub release below
#      can be published
#
# Because step 2 is outside CI, this workflow cannot verify that the version is live, so the
# GitHub release is created as a **draft**: the notes are ready, and nothing is announced before
# the package actually exists.
#
# One-time bootstrap, because npm cannot create a package through OIDC: the *first* version has
# to be published by a logged-in maintainer, and only then can the trusted publisher be
# registered. A newly created trusted-publisher record must complete its first publish within 2
# days or it expires, and existing records cannot be edited — only deleted and recreated.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (must match package.json)
        required: true
        type: string

# Least privilege at the *job* level, not the workflow: Scorecard's Token-Permissions check
# flagged the top-level `contents: write` here and nothing else in the repository. Only the job
# below needs it (to create the draft release), so only that job is granted it.
permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
      contents: write # required to create the draft GitHub release
    steps:
      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in a release build

      # Trusted publishing with a dist-tag needs npm >= 11.21.0, and the npm bundled with a Node
      # release can be older (Node 26 ships 11.20.0). Pin nothing; just take the current one.
      - name: Update npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PACKAGE_VERSION." >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      # The release gate is the same one CI runs, so a tag cannot ship something CI would reject.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Pack (dry run)
        run: npm pack --dry-run

      # A pre-release publishes under its own identifier (1.0.0-alpha.4 -> alpha) so it never takes
      # `latest` from a stable release. For a stable version the resolved tag is `latest`, which is
      # npm's default, so it is omitted rather than passed: a trust record that has not been
      # granted `npm dist-tag` may otherwise refuse it.
      - name: Resolve npm dist-tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          DIST_TAG="latest"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          fi
          echo "NPM_DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"

      # Stage, do not publish. `npm stage publish` is always permitted for a trusted publisher;
      # direct `npm publish` is not, on purpose.
      - name: Stage the release
        run: |
          if [ "$NPM_DIST_TAG" = "latest" ]; then
            npm stage publish
          else
            npm stage publish --tag "$NPM_DIST_TAG"
          fi

      - name: Report what a maintainer must do next
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Staged, not published

          \`@sven1103-agent/pi-metrics@${RELEASE_TAG#v}\` has been staged. Nothing is on the
          registry yet, and this workflow cannot put it there: the trusted publisher is
          deliberately not allowed to run \`npm publish\`.

          To release it, a maintainer approves the staged version with 2FA:

          \`\`\`bash
          npm stage list @sven1103-agent/pi-metrics   # find the id
          npm stage approve <id>
          \`\`\`

          Or approve it on npmjs.com. Then publish the draft GitHub release created by this run.
          EOF

      - name: Prepare release notes
        run: |
          VERSION="${RELEASE_TAG#v}"
          cat <<EOF > "$RUNNER_TEMP/release-notes.md"
          ## Install

          - pi package: \`pi install npm:@sven1103-agent/pi-metrics\`
          - pinned to this tag: \`pi install git:github.com/sven1103-agent/pi-metrics@${RELEASE_TAG}\`
          - npm: \`npm install @sven1103-agent/pi-metrics\`

          ## Verify

          - \`npm view @sven1103-agent/pi-metrics@${VERSION} dist.attestations\` — published from this
            repository through npm trusted publishing, so it carries a provenance attestation
          - compare \`${RELEASE_TAG}\` with \`package.json\`
          EOF

      # Draft: this run staged the version but cannot confirm it was approved, so nothing is
      # announced until a maintainer has done both. A draft is not sent to watchers.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          draft: true
