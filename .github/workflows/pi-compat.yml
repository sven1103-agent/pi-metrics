name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gating lane: versions the extension claims to support. Must stay green.
  supported:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pi: ["1.1.0", "1.2.0", "1.3.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pin all three host packages to the same Pi release. They are
      # peerDependencies at "*", so this overrides them for the run only.
      - name: Install Pi ${{ matrix.pi }}
        run: |
          npm install --no-save --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@${{ matrix.pi }}" \
            "@earendil-works/pi-ai@${{ matrix.pi }}" \
            "@earendil-works/pi-tui@${{ matrix.pi }}"

      - name: Typecheck against Pi ${{ matrix.pi }}
        run: npx tsc --noEmit

      - name: Factory smoke test
        run: node scripts/smoke.mjs

      - name: Load gate (real pi binary)
        env:
          PI_OFFLINE: "1"
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
        run: |
          set -o pipefail
          export PI_CODING_AGENT_DIR="$(mktemp -d)"
          out="$(npx pi --no-extensions -e extensions/pi-metrics.ts -p --no-session --no-tools "hi" 2>&1 || true)"
          if grep -q "Failed to load extension" <<<"$out"; then
            echo "::error::extension failed to load on Pi ${{ matrix.pi }}"
            echo "$out"
            exit 1
          fi
          echo "loaded on Pi ${{ matrix.pi }}"

  # Lower-bound lane: below 1.1.0 the published typings are incomplete. The load
  # path still works, and that is the claim worth gating — so this lane asserts the
  # load gate and merely *reports* typecheck errors as evidence for the README floor.
  # It is deliberately not continue-on-error: if these versions stop loading, that is
  # a real regression, not a known limitation.
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.99.2", "1.0.0", "1.0.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Pi ${{ matrix.pi }}
        run: |
          npm install --no-save --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@${{ matrix.pi }}" \
            "@earendil-works/pi-ai@${{ matrix.pi }}" \
            "@earendil-works/pi-tui@${{ matrix.pi }}"

      # Load gate runs FIRST in this lane. The typecheck below is expected to fail
      # before 1.1.0, and a failed step skips the rest of the job — which would mean
      # the load path was never actually exercised. The README claims these versions
      # load, so that claim has to be verified, not skipped.
      - name: Load gate — should pass, the type floor is not the runtime floor
        env:
          PI_OFFLINE: "1"
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
        run: |
          set -o pipefail
          export PI_CODING_AGENT_DIR="$(mktemp -d)"
          out="$(npx pi --no-extensions -e extensions/pi-metrics.ts -p --no-session --no-tools "hi" 2>&1 || true)"
          if grep -q "Failed to load extension" <<<"$out"; then
            echo "::error::extension failed to load on Pi ${{ matrix.pi }}"
            echo "$out"
            exit 1
          fi
          echo "loaded on Pi ${{ matrix.pi }}"

      # Reported, not asserted. Before 1.1.0 the published typings are incomplete, so
      # errors here are the documented lower bound — but the lane's own verdict is
      # about the load path, so this must not fail the job. It reports the error count
      # as evidence for the README floor instead of failing on a known limitation,
      # and it never asserts that the errors exist (upstream may backport fixes).
      - name: Typecheck against Pi ${{ matrix.pi }} (informational)
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc.log
          errors=$(grep -c "error TS" tsc.log || true)
          echo "### Pi ${{ matrix.pi }}: $errors typecheck error(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$errors" -eq 0 ]; then
            echo "::notice::typechecks clean on ${{ matrix.pi }} — the README floor may be lower than 1.1.0"
          else
            echo "expected before 1.1.0: $errors error(s) from incomplete published typings"
          fi
          exit 0
