name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gating lane: versions the extension claims to support. Must stay green.
  supported:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pi: ["1.1.0", "1.2.0", "1.3.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pin all three host packages to the same Pi release. They are
      # peerDependencies at "*", so this overrides them for the run only.
      # The whole Pi dependency family must move together. Installing only the three
      # packages the extension imports leaves transitive siblings (pi-codemode, pi-mcp,
      # ...) at the lockfile's newer versions, because pi-coding-agent declares them as
      # ^ranges. That mixture does not load: Pi 1.1.0 with pi-codemode 1.3.0 fails with
      # "does not provide an export named 'MCP_TYPESCRIPT_PREAMBLE'".
      - name: Install Pi ${{ matrix.pi }}
        run: |
          npm install --no-save --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@${{ matrix.pi }}" \
            "@earendil-works/pi-ai@${{ matrix.pi }}" \
            "@earendil-works/pi-tui@${{ matrix.pi }}" \
            "@earendil-works/pi-codemode@${{ matrix.pi }}" \
            "@earendil-works/pi-mcp@${{ matrix.pi }}" \
            "@earendil-works/pi-agent-core@${{ matrix.pi }}" \
            "@earendil-works/chord@${{ matrix.pi }}" \
            "@earendil-works/pi-telemetry@${{ matrix.pi }}"

      - name: Typecheck against Pi ${{ matrix.pi }}
        run: npx tsc --noEmit

      - name: Factory smoke test
        run: node scripts/smoke.mjs

      # Behavioural tests run per Pi version too: the event payload shapes these rely on
      # are exactly what a Pi release can change.
      - name: Behavioural tests
        run: node scripts/tokens.test.mjs && node scripts/tps-accuracy.test.mjs && node scripts/settings-alias.test.mjs && node scripts/hud-layout.test.mjs

      - name: Load gate (real pi binary)
        env:
          PI_OFFLINE: "1"
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
        run: |
          set -o pipefail
          export PI_CODING_AGENT_DIR="$(mktemp -d)"
          out="$(npx pi --no-extensions -e extensions/pi-metrics.ts -p --no-session --no-tools "hi" 2>&1 || true)"
          if grep -q "Failed to load extension" <<<"$out"; then
            echo "::error::extension failed to load on Pi ${{ matrix.pi }}"
            echo "$out"
            exit 1
          fi
          echo "loaded on Pi ${{ matrix.pi }}"

  # Lower-bound lane: below 1.1.0 the published typings are incomplete. The load
  # path still works, and that is the claim worth gating — so this lane asserts the
  # load gate and merely *reports* typecheck errors as evidence for the README floor.
  # It is deliberately not continue-on-error: if these versions stop loading, that is
  # a real regression, not a known limitation.
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.99.2", "1.0.0", "1.0.4"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The whole Pi dependency family must move together. Installing only the three
      # packages the extension imports leaves transitive siblings (pi-codemode, pi-mcp,
      # ...) at the lockfile's newer versions, because pi-coding-agent declares them as
      # ^ranges. That mixture does not load: Pi 1.1.0 with pi-codemode 1.3.0 fails with
      # "does not provide an export named 'MCP_TYPESCRIPT_PREAMBLE'".
      - name: Install Pi ${{ matrix.pi }}
        run: |
          npm install --no-save --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@${{ matrix.pi }}" \
            "@earendil-works/pi-ai@${{ matrix.pi }}" \
            "@earendil-works/pi-tui@${{ matrix.pi }}" \
            "@earendil-works/pi-codemode@${{ matrix.pi }}" \
            "@earendil-works/pi-mcp@${{ matrix.pi }}" \
            "@earendil-works/pi-agent-core@${{ matrix.pi }}" \
            "@earendil-works/chord@${{ matrix.pi }}" \
            "@earendil-works/pi-telemetry@${{ matrix.pi }}"

      # Load gate runs FIRST in this lane. The typecheck below is expected to fail
      # before 1.1.0, and a failed step skips the rest of the job — which would mean
      # the load path was never actually exercised. The README claims these versions
      # load, so that claim has to be verified, not skipped.
      - name: Load gate — should pass, the type floor is not the runtime floor
        env:
          PI_OFFLINE: "1"
          PI_SKIP_VERSION_CHECK: "1"
          PI_TELEMETRY: "0"
        run: |
          set -o pipefail
          export PI_CODING_AGENT_DIR="$(mktemp -d)"
          out="$(npx pi --no-extensions -e extensions/pi-metrics.ts -p --no-session --no-tools "hi" 2>&1 || true)"
          if grep -q "Failed to load extension" <<<"$out"; then
            echo "::error::extension failed to load on Pi ${{ matrix.pi }}"
            echo "$out"
            exit 1
          fi
          echo "loaded on Pi ${{ matrix.pi }}"

      # Reported, not asserted. Before 1.1.0 the published typings are incomplete, so
      # errors here describe the documented lower bound — but they are not defects in
      # this repository, and tsc would otherwise raise each one as a `failure`
      # annotation on the source file, making the repo look broken. Writing to a plain
      # log and printing the summary keeps the evidence without the false alarm.
      # It never asserts that errors exist, so an upstream backport that lowers the
      # floor will not turn this lane red.
      - name: Typecheck against Pi ${{ matrix.pi }} (informational)
        run: |
          set +e
          # The runner image ships a TypeScript problem matcher that turns every
          # `file(line,col): error TSxxxx` line into a failure annotation on the
          # source file. These errors come from incomplete published typings in
          # older Pi releases, not from this repository, so they must not be
          # reported as repo failures. Drop the matcher, then summarize by code
          # only — no file(line,col) shape in the output.
          echo "::remove-matcher owner=tsc::"
          npx tsc --noEmit --pretty false > tsc.log 2>&1
          errors=$(grep -c "error TS" tsc.log || true)
          echo "### Pi ${{ matrix.pi }}: $errors typecheck error(s)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$errors" -eq 0 ]; then
            echo "::notice::typechecks clean on Pi ${{ matrix.pi }} — the README floor may be lower than 1.1.0"
          else
            echo "expected before Pi 1.1.0 — $errors error(s) from incomplete published typings:"
            grep -o "error TS[0-9]*: .*" tsc.log | sort | uniq -c
          fi
          exit 0
