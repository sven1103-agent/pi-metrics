# TEMPORARY diagnostic — delete after use.
#
# Answers one question definitively: does this repository actually grant
# `id-token: write`, which npm trusted publishing needs? The failing publish run
# printed effective permissions of "Contents: write / Metadata: read" only, and
# a publish without an OIDC token is anonymous, which npm reports as a 404.
name: OIDC probe

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report what GitHub granted
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL present : ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}${ACTIONS_ID_TOKEN_REQUEST_URL:-no}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-no}"

      - name: Request an ID token
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::id-token: write was NOT granted — there is no token endpoint to call"
            exit 1
          fi
          url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org"
          code=$(curl -sS -o /tmp/token.json -w '%{http_code}' \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$url")
          echo "token endpoint HTTP $code, $(wc -c < /tmp/token.json) bytes"
          if [ "$code" != "200" ]; then
            echo "::error::token request failed"
            cat /tmp/token.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/token.json"))
          tok = d.get("value", "")
          print("token length:", len(tok))
          import base64
          payload = tok.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("sub", "aud", "repository", "ref", "job_workflow_ref", "event_name"):
              print(f"  {k}: {claims.get(k)}")
          PY
